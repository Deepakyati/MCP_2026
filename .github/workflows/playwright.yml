name: Playwright CI

on:
  push:
    branches: [main]
    paths:
      - 'PlaywrightMCP2027/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PlaywrightMCP2027/**'
      - '.github/workflows/playwright.yml'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlaywrightMCP2027
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PlaywrightMCP2027/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        run: npm test
      - name: Run HTTP smoke tests
        run: npm run test:api
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            PlaywrightMCP2027/playwright-report/
            PlaywrightMCP2027/playwright-report-api/
            PlaywrightMCP2027/test-results/
          retention-days: 14
